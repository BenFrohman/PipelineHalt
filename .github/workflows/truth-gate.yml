# Reusable Truth Gate workflow. Call it from a formalization repo:
#
#   jobs:
#     truth-gate:
#       uses: BenFrohman/PipelineHalt/.github/workflows/truth-gate.yml@main
#
# It never rebuilds Mathlib: when the project depends on Mathlib it fetches the published oleans with
# `lake exe cache get` before `lake build`.
name: truth-gate
on:
  workflow_call:
    inputs:
      lock:
        description: Lock file, relative to the Lean project
        type: string
        default: truth-gate.lock.json
      project:
        description: Lake project directory
        type: string
        default: .
      lock-script:
        description: In-build lock audit generated by `pipelinehalt truth-gate emit-lean`
        type: string
        default: scripts/SemanticsLock.lean
      pipelinehalt-ref:
        description: PipelineHalt git ref to run
        type: string
        default: main
jobs:
  truth-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ${{ inputs.project }}/.lake
          key: lake-${{ runner.os }}-${{ hashFiles(format('{0}/lean-toolchain', inputs.project), format('{0}/lake-manifest.json', inputs.project)) }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles(format('{0}/lean-toolchain', inputs.project), format('{0}/lake-manifest.json', inputs.project)) }}-
      - name: Fetch Mathlib cache (never rebuild Mathlib)
        working-directory: ${{ inputs.project }}
        run: |
          if [ -f lake-manifest.json ] && grep -q '"mathlib"' lake-manifest.json; then lake exe cache get; fi
      - name: lake build (includes the in-build #eval semantics lock)
        working-directory: ${{ inputs.project }}
        run: lake build 2>&1 | tee lake-build.log
      - name: Run the semantics lock script explicitly
        working-directory: ${{ inputs.project }}
        run: lake env lean ${{ inputs.lock-script }}
      - uses: actions/checkout@v4
        with:
          repository: BenFrohman/PipelineHalt
          ref: ${{ inputs.pipelinehalt-ref }}
          path: _pipelinehalt
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build PipelineHalt
        working-directory: _pipelinehalt
        run: npm install && npx tsc -b
      - name: Observation pass (mandatory first step; changes nothing)
        run: node _pipelinehalt/dist/src/bin.js truth-gate observe --project ${{ inputs.project }} --lock ${{ inputs.project }}/${{ inputs.lock }}
      - name: Truth Gate check
        run: >
          node _pipelinehalt/dist/src/bin.js truth-gate check --project ${{ inputs.project }}
          --lock ${{ inputs.project }}/${{ inputs.lock }} --require-observation --ci
          --report-md "$GITHUB_STEP_SUMMARY" --report-json truth-gate-report.json --badge truth-gate-badge.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truth-gate
          path: |
            truth-gate-report.json
            truth-gate-badge.json
            ${{ inputs.project }}/lake-build.log
            ${{ inputs.project }}/.pipelinehalt/observation.json
