# Reusable Truth Gate workflow. Call it from a formalization repo:
#
#   jobs:
#     truth-gate:
#       uses: BenFrohman/PipelineHalt/.github/workflows/truth-gate.yml@main
#
# It runs scripts/verify-lock.sh: preflight, compile Semantics, observation pass (#check intended_correspondence,
# #print paper_claim, #print formal_claim), lake build with the in-build lock, the lock script, and truth-gate check.
# It never rebuilds Mathlib: when the project depends on Mathlib it fetches the published oleans with
# `lake exe cache get` before building.
name: truth-gate
on:
  workflow_call:
    inputs:
      lock:
        description: Lock file, relative to the Lean project
        type: string
        default: truth-gate.lock.json
      project:
        description: Lake project directory
        type: string
        default: .
      lock-script:
        description: In-build lock audit generated by `pipelinehalt truth-gate emit-lean`
        type: string
        default: scripts/SemanticsLock.lean
      pipelinehalt-ref:
        description: PipelineHalt git ref to run
        type: string
        default: main
jobs:
  truth-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ${{ inputs.project }}/.lake
          key: lake-${{ runner.os }}-${{ hashFiles(format('{0}/lean-toolchain', inputs.project), format('{0}/lake-manifest.json', inputs.project)) }}-${{ github.sha }}
          restore-keys: lake-${{ runner.os }}-${{ hashFiles(format('{0}/lean-toolchain', inputs.project), format('{0}/lake-manifest.json', inputs.project)) }}-
      - uses: actions/checkout@v4
        with:
          repository: BenFrohman/PipelineHalt
          ref: ${{ inputs.pipelinehalt-ref }}
          path: _pipelinehalt
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build PipelineHalt
        working-directory: _pipelinehalt
        run: npm install && npx tsc -b
      - name: Truth Gate (scripts/verify-lock.sh; observation pass is the first Lean step; never rebuilds Mathlib)
        env:
          LOCK: ${{ inputs.lock }}
          LOCK_SCRIPT: ${{ inputs.lock-script }}
          REPORT_DIR: ${{ github.workspace }}/truth-gate-out
          CI: "1"
        run: |
          set +e
          "$GITHUB_WORKSPACE/_pipelinehalt/scripts/verify-lock.sh" "${{ inputs.project }}"; rc=$?
          [ -f truth-gate-out/truth-gate-report.md ] && cat truth-gate-out/truth-gate-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truth-gate
          path: truth-gate-out/
